services:
  postgres:
    image: postgres:16-alpine
    container_name: mi-biblioteca-postgres
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: booksvc
      POSTGRES_PASSWORD: booksvc_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksvc -d bookdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
