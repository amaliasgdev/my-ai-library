<section
  aria-labelledby="saga-edit-heading"
  [attr.aria-busy]="state().status === 'loading' || submitting()"
>
  <h1 id="saga-edit-heading" tabindex="-1">Editar saga</h1>
  @let current = state();
  @switch (current.status) {
    @case ('loading') {
      <app-loading-state message="Cargando saga…" />
    }
    @case ('error') {
      <app-inline-feedback variant="error">{{ current.message }}</app-inline-feedback>
      @if (currentId()) {
        <button mat-button type="button" (click)="retry()">Reintentar</button>
      }
    }
    @case ('loaded') {
      @if (generalError()) {
        <app-inline-feedback variant="error">{{ generalError() }}</app-inline-feedback>
      }
      <app-saga-form
        [initialSaga]="current.saga"
        [submitting]="submitting()"
        [saveLabel]="'Guardar cambios'"
        [submissionMessage]="submitting() ? 'Guardando cambios…' : ''"
        (save)="save($event)"
        (cancelled)="cancel()"
      />
    }
  }
  @if (current.status !== 'loaded') {
    <a mat-button routerLink="/sagas">Volver a Mis sagas</a>
  }
</section>
