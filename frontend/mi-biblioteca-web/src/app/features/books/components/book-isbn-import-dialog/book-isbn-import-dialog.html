<h2 mat-dialog-title>Introducir ISBN</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>ISBN</mat-label>
      <input matInput formControlName="isbn" type="text" autocomplete="off" />
      <mat-hint>ISBN-13; puedes usar espacios o guiones</mat-hint>
      @if (form.controls.isbn.hasError('isbn')) {
        <mat-error>Introduce un ISBN-13 válido con dígito de control correcto</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit">Continuar</button>
  </mat-dialog-actions>
</form>
