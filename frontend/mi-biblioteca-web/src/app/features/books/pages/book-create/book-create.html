<section aria-labelledby="create-heading">
  <h1 id="create-heading">Añadir libro</h1>
  @if (detectedIsbn()) {
    <p role="status">ISBN detectado: {{ detectedIsbn() }}</p>
  }
  @if (generalError()) {
    <p role="alert" class="error-panel">{{ generalError() }}</p>
  }
  <app-book-form
    [locations]="locationEditor.rooms()"
    [locationsLoading]="locationEditor.loading()"
    [locationsError]="locationEditor.error()"
    (locationsRequested)="locationEditor.load()"
    (locationCreateRequested)="locationEditor.create($event)"
    [submitting]="submitting()"
    [lookupEnabled]="true"
    [scanEnabled]="true"
    [lookupLoading]="lookupState() === 'loading'"
    [lookupSuccess]="lookupState() === 'success'"
    [lookupError]="lookupError()"
    (lookupRequested)="lookup($event)"
    (isbnChanged)="isbnChanged()"
    (scanRequested)="openScanner()"
    (submitAttempted)="cancelLookup()"
    (save)="save($event)"
    (cancelled)="cancel()"
  />
</section>
