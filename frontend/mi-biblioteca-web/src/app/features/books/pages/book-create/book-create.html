<section aria-labelledby="create-heading">
  <h1 id="create-heading">Añadir libro</h1>
  @if (detectedIsbn()) {
    <app-inline-feedback variant="info">ISBN detectado: {{ detectedIsbn() }}</app-inline-feedback>
  }
  @if (generalError()) {
    <app-inline-feedback variant="error">{{ generalError() }}</app-inline-feedback>
  }
  <app-book-form
    [submitting]="submitting()"
    [lookupEnabled]="true"
    [scanEnabled]="true"
    [lookupLoading]="lookupState() === 'loading'"
    [lookupSuccess]="lookupState() === 'success'"
    [lookupError]="lookupError()"
    (lookupRequested)="lookup($event)"
    (isbnChanged)="isbnChanged()"
    (scanRequested)="openScanner()"
    (submitAttempted)="cancelLookup()"
    (save)="save($event)"
    (cancelled)="cancel()"
  />
</section>
