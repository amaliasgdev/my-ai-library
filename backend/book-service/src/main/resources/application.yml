server:
  port: 8081
  tomcat:
    # Bounded draining lets ordinary oversized multipart requests receive our 413.
    max-swallow-size: 8MB

spring:
  application:
    name: book-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
    username: ${DB_USER:booksvc}
    password: ${DB_PASSWORD:booksvc_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

photo-import:
  enabled: ${PHOTO_IMPORT_ENABLED:false}
  provider: ${PHOTO_IMPORT_PROVIDER:none}
  model: ${PHOTO_IMPORT_MODEL:gpt-5-mini}
  connect-timeout: ${PHOTO_IMPORT_CONNECT_TIMEOUT:5s}
  request-timeout: ${PHOTO_IMPORT_REQUEST_TIMEOUT:40s}
  max-output-tokens: ${PHOTO_IMPORT_MAX_OUTPUT_TOKENS:6000}
  max-response-bytes: ${PHOTO_IMPORT_MAX_RESPONSE_BYTES:1048576}
  max-file-size: 5MB
  max-width: 6000
  max-height: 6000
  max-pixels: 20000000
  max-observations: 25
  max-concurrent-analyses: 1
  analysis-timeout: 45s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

external:
  books:
    open-library:
      base-url: https://openlibrary.org
      covers-base-url: https://covers.openlibrary.org
      connect-timeout: 1s
      request-timeout: 3s
      lookup-timeout: 8s
      user-agent: MyAILibrary
      contact: ${OPEN_LIBRARY_CONTACT:}

storage:
  covers:
    directory: ${COVERS_DIRECTORY:./data/covers}
    public-base-url: ${COVERS_PUBLIC_BASE_URL:http://localhost:8081/api/covers}
    max-file-size: 5MB
    max-width: 6000
    max-height: 6000
    max-pixels: 20000000
