server:
  port: 8081
  tomcat:
    # Bounded draining lets ordinary oversized multipart requests receive our 413.
    max-swallow-size: 8MB

spring:
  application:
    name: book-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
    username: ${DB_USER:booksvc}
    password: ${DB_PASSWORD:booksvc_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

external:
  books:
    open-library:
      base-url: https://openlibrary.org
      covers-base-url: https://covers.openlibrary.org
      connect-timeout: 1s
      request-timeout: 3s
      lookup-timeout: 8s
      user-agent: MyAILibrary
      contact: ${OPEN_LIBRARY_CONTACT:}

storage:
  covers:
    directory: ${COVERS_DIRECTORY:./data/covers}
    public-base-url: ${COVERS_PUBLIC_BASE_URL:http://localhost:8081/api/covers}
    max-file-size: 5MB
    max-width: 6000
    max-height: 6000
    max-pixels: 20000000
