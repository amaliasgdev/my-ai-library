# Test-classpath only. Missing values fail rather than falling back to bookdb.
# Applies to SpringBootTest, DataJpaTest and WebMvcTest without a profile opt-in.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.flyway.url=${TEST_DB_URL}
spring.flyway.user=${TEST_DB_USERNAME}
spring.flyway.password=${TEST_DB_PASSWORD}
storage.covers.directory=${user.dir}/target/test-covers
